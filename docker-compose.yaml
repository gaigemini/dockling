version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: docling-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - docling-network

  minio:
    image: minio/minio:latest
    container_name: docling-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - docling-network

  docling-api:
    image: registry.gai.co.id/gai/docling_api:latest
    container_name: docling-api
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8000"
    environment:
      - APP_ENV=prod
      - DOCLING_ENV=prod
      - MINIO_ENABLED=true
      - MINIO_ENDPOINT=minio:9000
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data
      - ./output:/app/output
      - ./env:/app/env
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - docling-network

volumes:
  redis-data:
  minio-data:

networks:
  docling-network:
    external: true
    name: dbr0